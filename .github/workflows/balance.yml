name: Balance

# Plays 100 all-AI campaigns and the unit lab, and posts the reports on the run's summary page
# (docs/BALANCE.md, "How many campaigns"): nightly on the default branch, on demand, and on pull
# requests labelled "balance", where the pull request is compared with its base branch on the
# same campaigns. The nightly run's artifact can serve as the shared baseline for its commit.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      games:
        description: Campaigns to play (on each side when comparing)
        default: '100'
      vs:
        description: Compare with a git ref (main, a tag, a commit) or "defaults"; blank for a plain run
        default: ''
      set:
        description: Config overrides, space-separated (AI.warStrengthRatio=1.3 UNITS.tank.cost.money=280)
        default: ''
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: balance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  balance:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'balance')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GAMES: ${{ github.event_name == 'pull_request' && '100' || inputs.games || '100' }}
      VS: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || inputs.vs }}
      SET: ${{ inputs.set }}
    steps:
      - uses: actions/checkout@v4
        with:
          # --vs checks out the other side from history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Unit lab
        run: |
          args=(--quiet --out balance-runs/units)
          if [ -n "$VS" ]; then args+=(--vs "$VS"); fi
          for s in $SET; do args+=(--set "$s"); done
          npm run balance:units -- "${args[@]}"
      - name: Campaigns
        run: |
          args=(--games "$GAMES" --quiet --out balance-runs/campaigns)
          if [ -n "$VS" ]; then args+=(--vs "$VS"); fi
          for s in $SET; do args+=(--set "$s"); done
          npm run balance -- "${args[@]}"
      - name: Post the reports
        if: always()
        run: |
          for f in balance-runs/campaigns/compare.md balance-runs/campaigns/report.md balance-runs/units/compare.md balance-runs/units/units.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-runs
          path: |
            balance-runs/campaigns/
            balance-runs/units/
          if-no-files-found: ignore
