name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Browser playthrough of the full gameplay loop against the production build.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # The phone layouts, driven by touch: upright, then on its side.
      - run: npm run e2e:mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output
          path: e2e-output/
          if-no-files-found: ignore
